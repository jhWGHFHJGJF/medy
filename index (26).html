<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Глубина — аквариум с медузами</title>
<meta name="description" content="Интерактивный 3D-аквариум с медузами. Медитативная сцена на Three.js: полупрозрачные купола, колышущиеся щупальца, лучи света в толще воды.">
<meta name="theme-color" content="#02060f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   ПЕРЕМЕННЫЕ
   Цвет воды и акцентов меняется здесь.
   ===================================================================== */
:root{
  --deep: #02060f;          /* самый тёмный тон воды */
  --mid:  #071726;          /* средний тон */
  --text: #e8f1ff;
  --muted: #7b90ad;
  --line: rgba(180, 215, 255, 0.16);
  --glass: rgba(8, 20, 34, 0.55);
  --accent: #9fd8ff;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
}

*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body{ height: 100%; width: 100%; overflow: hidden; background: var(--deep); color: var(--text); font-family: var(--sans); }

#scene{ position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active{ cursor: grabbing; }

/* ---------- ВЕРХНИЙ УГОЛ: ЛОГОТИП ---------- */
.brand{
  position: fixed; top: 26px; left: 30px; z-index: 20;
  font-family: var(--serif); font-size: 26px; font-weight: 400;
  letter-spacing: 8px; text-transform: uppercase; color: #eaf4ff;
  text-shadow: 0 0 26px rgba(140, 200, 255, 0.45);
  pointer-events: none; user-select: none;
}
.brand small{
  display: block; font-family: var(--sans); font-size: 9.5px;
  letter-spacing: 3.4px; color: var(--muted); margin-top: 6px; font-weight: 300;
}

/* ---------- ПРАВЫЙ ВЕРХНИЙ УГОЛ: КНОПКИ ---------- */
.tools{
  position: fixed; top: 26px; right: 30px; z-index: 20;
  display: flex; gap: 10px; align-items: center;
}
.round-btn{
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  color: #cfe6ff; display: grid; place-items: center;
  cursor: pointer; font-size: 14px; transition: all 0.3s ease;
}
.round-btn:hover{ background: rgba(150, 200, 255, 0.18); color: #fff; border-color: rgba(180,215,255,.4); }
.round-btn.on{ background: #dff0ff; color: #04101d; border-color: #fff; box-shadow: 0 0 24px rgba(160, 215, 255, 0.55); }

.dive-btn{
  height: 42px; padding: 0 20px; border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  color: #cfe6ff; font-family: var(--sans); font-size: 12px;
  letter-spacing: 1.6px; text-transform: uppercase; font-weight: 400;
  cursor: pointer; transition: all 0.3s ease;
}
.dive-btn:hover{ background: rgba(150, 200, 255, 0.18); color: #fff; }
.dive-btn.on{ background: #dff0ff; color: #04101d; border-color: #fff; box-shadow: 0 0 24px rgba(160,215,255,.4); }

/* ---------- КАРТОЧКА МЕДУЗЫ ---------- */
#card{
  position: fixed; top: 50%; right: 30px; transform: translateY(-50%) translateX(120%);
  width: min(340px, calc(100% - 60px)); z-index: 30;
  padding: 26px 24px 28px; border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform 0.62s cubic-bezier(0.2, 0.85, 0.2, 1), opacity 0.4s;
  opacity: 0;
}
#card.open{ transform: translateY(-50%) translateX(0); opacity: 1; }

.card-close{
  position: absolute; top: 14px; right: 14px; z-index: 3;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(255,255,255,.06);
  color: #dcecff; font-size: 13px; cursor: pointer;
  display: grid; place-items: center; transition: background .2s;
}
.card-close:hover{ background: rgba(255,255,255,.18); }

.card-latin{
  pointer-events: none;
  font-family: var(--serif); font-style: italic; font-size: 13px;
  color: var(--accent); letter-spacing: 0.6px; margin-bottom: 10px; opacity: .9;
}
#card h2{
  padding-right: 34px;
  font-family: var(--serif); font-size: 30px; font-weight: 400;
  letter-spacing: 0.5px; line-height: 1.15; margin-bottom: 14px; color: #f2f8ff;
}
#card p{
  font-size: 13.5px; line-height: 1.75; color: #b9cbe2; font-weight: 300;
}
.card-line{
  display: flex; justify-content: space-between; gap: 12px;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--muted);
}
.card-line b{ color: #dcecff; font-weight: 400; }

/* ---------- ПОДСКАЗКА ВНИЗУ ---------- */
#hint{
  position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
  z-index: 15; font-size: 11px; letter-spacing: 3.4px; text-transform: uppercase;
  color: rgba(150, 180, 214, 0.6); pointer-events: none;
  transition: opacity 1.4s ease; white-space: nowrap;
}
#hint.fade{ opacity: 0; }

/* ---------- ЗАГРУЗКА И ОШИБКА ---------- */
#loader{
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center;
  background: var(--deep); transition: opacity 1s ease;
}
#loader.hide{ opacity: 0; pointer-events: none; }
.loader-inner{ text-align: center; }
.loader-ring{
  width: 46px; height: 46px; margin: 0 auto 20px;
  border: 1px solid rgba(159, 216, 255, 0.18);
  border-top-color: rgba(159, 216, 255, 0.8);
  border-radius: 50%; animation: rotate 1.6s linear infinite;
}
@keyframes rotate{ to{ transform: rotate(360deg); } }
.loader-inner span{
  font-family: var(--sans); font-size: 10px; letter-spacing: 4px;
  text-transform: uppercase; color: rgba(150, 180, 214, 0.55); font-weight: 300;
}

#fallback{
  position: fixed; inset: 0; z-index: 80; display: none; place-items: center;
  text-align: center; padding: 30px; background: var(--deep);
  font-size: 13.5px; line-height: 1.8; color: #93aac6; font-weight: 300;
}
#fallback.show{ display: grid; }

/* ---------- МОБИЛЬНЫЕ ---------- */
@media (max-width: 768px){
  .brand{ top: 18px; left: 18px; font-size: 19px; letter-spacing: 5px; }
  .brand small{ font-size: 8px; letter-spacing: 2.6px; margin-top: 4px; }
  .tools{ top: 18px; right: 16px; gap: 8px; }
  .round-btn{ width: 38px; height: 38px; font-size: 12px; }
  .dive-btn{ height: 38px; padding: 0 15px; font-size: 10.5px; letter-spacing: 1.2px; }

  /* Карточка выезжает снизу как шторка */
  #card{
    top: auto; bottom: 0; left: 0; right: 0; width: 100%;
    transform: translateY(105%); border-radius: 22px 22px 0 0;
    border-left: none; border-right: none; border-bottom: none;
    padding: 22px 20px 30px; max-height: 66vh; overflow-y: auto;
  }
  #card.open{ transform: translateY(0); }
  #card h2{ font-size: 25px; }
  #hint{ bottom: 16px; font-size: 9px; letter-spacing: 2.4px; }
}

@media (prefers-reduced-motion: reduce){
  .loader-ring{ animation: none; }
  #card{ transition: opacity .3s; }
}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="brand">Глубина<small>живой аквариум</small></div>

<div class="tools">
  <button class="round-btn" id="btnSound" title="Звук воды" aria-label="Звук"><span id="soundIcon">◌</span></button>
  <button class="dive-btn" id="btnDive">Погрузиться</button>
</div>

<aside id="card" aria-live="polite"></aside>

<div id="hint">вращай и наблюдай</div>

<div id="loader"><div class="loader-inner"><div class="loader-ring"></div><span>погружение</span></div></div>

<div id="fallback">
  Не удалось загрузить Three.js.<br>
  Проверь соединение с интернетом и обнови страницу.
</div>

<!-- Three.js r128 (UMD) и OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
'use strict';

if (typeof THREE === 'undefined'){
  document.getElementById('fallback').classList.add('show');
  document.getElementById('loader').classList.add('hide');
}

/* =====================================================================
   1. КОНФИГУРАЦИЯ
   ---------------------------------------------------------------------
   Всё, что хочется покрутить, собрано здесь.
   jellyCount   — сколько медуз в сцене
   pulseSpeed   — скорость пульсации купола
   pulseDepth   — насколько сильно сжимается купол (0…1)
   waterTop/waterBottom — цвет воды у поверхности и на глубине
   repelRadius  — радиус, в котором курсор отталкивает медуз
   ===================================================================== */
const CONFIG = {
  jellyCount: 6,
  tentaclesPerJelly: 8,
  tentacleSegments: 12,
  pulseSpeed: 1.05,
  pulseDepth: 0.55,
  driftSpeed: 0.16,
  repelRadius: 7.5,
  repelForce: 0.9,
  waterTop: 0x0b2b45,
  waterBottom: 0x010309,
  fogDensity: 0.0075,
  plankton: 900,
  bubbles: 130,
  shafts: 5,
  diveDepth: -16,
  diveDuration: 2.8
};

/* Мобильные: меньше геометрии и частиц */
const IS_MOBILE = matchMedia('(max-width: 768px)').matches || navigator.maxTouchPoints > 1;
const DPR_CAP = IS_MOBILE ? 1.5 : 2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

if (IS_MOBILE){
  CONFIG.jellyCount = 4;
  CONFIG.tentaclesPerJelly = 5;
  CONFIG.tentacleSegments = 9;
  CONFIG.plankton = 340;
  CONFIG.bubbles = 45;
  CONFIG.shafts = 3;
}

/* =====================================================================
   2. ВИДЫ МЕДУЗ — ТЕКСТЫ КАРТОЧЕК
   ---------------------------------------------------------------------
   Меняй здесь названия и описания:
   name, latin — название и латинское имя
   text        — короткий факт, 1–2 спокойных предложения
   size        — размер купола для карточки
   depth       — глубина обитания для карточки
   ===================================================================== */
const SPECIES = [
  {
    name: 'Аурелия',
    latin: 'Aurelia aurita',
    text: 'Лунная медуза прибрежных вод. Купол почти прозрачен, сквозь него видны четыре кольца — гонады. Жалит слабо, скорее напоминает о себе, чем ранит.',
    size: 'до 40 см',
    depth: '0–30 м'
  },
  {
    name: 'Цианея',
    latin: 'Cyanea capillata',
    text: 'Самая крупная медуза на планете. Купол вырастает до двух метров, а щупальца тянутся на десятки метров вниз, в холодную толщу воды.',
    size: 'до 2 м',
    depth: '0–20 м'
  },
  {
    name: 'Пелагия',
    latin: 'Pelagia noctiluca',
    text: 'Ночью светится: потревоженная вода вспыхивает вокруг неё голубыми искрами. Обитает в тёплом Средиземном море, держится у поверхности.',
    size: 'до 10 см',
    depth: '0–150 м'
  },
  {
    name: 'Морская оса',
    latin: 'Chironex fleckeri',
    text: 'Кубомедуза размером с баскетбольный мяч. Одна из самых ядовитых медуз мира, встречается у северных берегов Австралии.',
    size: 'до 30 см',
    depth: '0–10 м'
  }
];

/* =====================================================================
   3. СЦЕНА, КАМЕРА, РЕНДЕРЕР
   ===================================================================== */
const canvasEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({
  canvas: canvasEl,
  antialias: !IS_MOBILE,
  powerPreference: 'high-performance',
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
renderer.setSize(window.innerWidth, window.innerHeight);
if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03101c, CONFIG.fogDensity);

const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 600);
const HOME_POS = new THREE.Vector3(0, 5, 36);
const HOME_TARGET = new THREE.Vector3(0, 0, 0);
camera.position.copy(HOME_POS);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.42;
controls.zoomSpeed = 0.7;
controls.minDistance = 8;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.78;
controls.minPolarAngle = Math.PI * 0.16;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.16;

/* =====================================================================
   4. ВОДА: ГРАДИЕНТНАЯ СФЕРА ВОКРУГ СЦЕНЫ
   ===================================================================== */
const waterGeo = new THREE.SphereGeometry(320, 32, 24);
const waterMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uTop:    { value: new THREE.Color(CONFIG.waterTop) },
    uBottom: { value: new THREE.Color(CONFIG.waterBottom) },
    uTime:   { value: 0 }
  },
  vertexShader: `
    varying vec3 vPos;
    void main(){
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uTop;
    uniform vec3 uBottom;
    uniform float uTime;
    varying vec3 vPos;
    void main(){
      float h = clamp(vPos.y / 320.0 * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(uBottom, uTop, pow(h, 1.5));
      float veil = sin(vPos.x * 0.01 + uTime * 0.12) * sin(vPos.z * 0.012 + uTime * 0.09);
      col += veil * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(waterGeo, waterMat));

/* =====================================================================
   5. СВЕТ
   ===================================================================== */
const topLight = new THREE.DirectionalLight(0xa8d8ff, 1.25);
topLight.position.set(6, 40, 12);
scene.add(topLight);

const ambient = new THREE.AmbientLight(0x1b3a55, 0.9);
scene.add(ambient);

const bottomLight = new THREE.PointLight(0x2f6f9e, 0.55, 120, 2);
bottomLight.position.set(0, -26, 6);
scene.add(bottomLight);

/* =====================================================================
   6. СВЕТОВЫЕ ЛУЧИ СВЕРХУ
   Плоскости с аддитивной текстурой, медленно покачиваются.
   ===================================================================== */
function makeShaftTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 512;
  const ctx = c.getContext('2d');

  const v = ctx.createLinearGradient(0, 0, 0, 512);
  v.addColorStop(0.0, 'rgba(180, 225, 255, 0.55)');
  v.addColorStop(0.35, 'rgba(150, 205, 245, 0.22)');
  v.addColorStop(1.0, 'rgba(120, 180, 230, 0)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, 128, 512);

  const h = ctx.createLinearGradient(0, 0, 128, 0);
  h.addColorStop(0.0, 'rgba(0,0,0,1)');
  h.addColorStop(0.5, 'rgba(0,0,0,0)');
  h.addColorStop(1.0, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = h;
  ctx.fillRect(0, 0, 128, 512);
  ctx.globalCompositeOperation = 'source-over';

  return new THREE.CanvasTexture(c);
}

const shaftTex = makeShaftTexture();
const shafts = [];

for (let i = 0; i < CONFIG.shafts; i++){
  const geo = new THREE.PlaneGeometry(26 + Math.random() * 22, 170);
  const mat = new THREE.MeshBasicMaterial({
    map: shaftTex,
    transparent: true,
    opacity: 0.16 + Math.random() * 0.14,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(
    (Math.random() - 0.5) * 70,
    34 + Math.random() * 14,
    (Math.random() - 0.5) * 60 - 10
  );
  mesh.rotation.z = (Math.random() - 0.5) * 0.35;
  mesh.rotation.y = (Math.random() - 0.5) * 0.7;
  scene.add(mesh);
  shafts.push({
    mesh: mesh,
    mat: mat,
    baseOpacity: mat.opacity,
    phase: Math.random() * Math.PI * 2,
    speed: 0.12 + Math.random() * 0.16,
    sway: 0.02 + Math.random() * 0.05
  });
}

/* =====================================================================
   7. ПЛАНКТОН И ПУЗЫРИ
   ===================================================================== */
function makeDotTexture(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(210,240,255,0.55)');
  g.addColorStop(1.0, 'rgba(160,210,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const dotTex = makeDotTexture();

/* Планктон: мелкие частицы, медленно блуждающие */
(function buildPlankton(){
  const pos = new Float32Array(CONFIG.plankton * 3);
  const phase = new Float32Array(CONFIG.plankton);
  const sizes = new Float32Array(CONFIG.plankton);

  for (let i = 0; i < CONFIG.plankton; i++){
    pos[i*3]     = (Math.random() - 0.5) * 120;
    pos[i*3 + 1] = (Math.random() - 0.5) * 80;
    pos[i*3 + 2] = (Math.random() - 0.5) * 100;
    phase[i] = Math.random() * Math.PI * 2;
    sizes[i] = 0.6 + Math.random() * 1.9;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixel: { value: renderer.getPixelRatio() }
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aPhase;
      attribute float aSize;
      uniform float uTime;
      uniform float uPixel;
      varying float vAlpha;
      void main(){
        vec3 p = position;
        p.x += sin(uTime * 0.22 + aPhase) * 1.6;
        p.y += cos(uTime * 0.17 + aPhase * 1.7) * 1.2;
        p.z += cos(uTime * 0.19 + aPhase * 0.8) * 1.4;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;

        vAlpha = 0.25 + 0.4 * (0.5 + 0.5 * sin(uTime * 0.8 + aPhase * 3.0));
        gl_PointSize = aSize * uPixel * (120.0 / -mv.z);
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      void main(){
        vec2 d = gl_PointCoord - vec2(0.5);
        float r = length(d);
        if (r > 0.5) discard;
        float a = smoothstep(0.5, 0.0, r) * vAlpha;
        gl_FragColor = vec4(0.78, 0.92, 1.0, a);
      }
    `
  });

  scene.add(new THREE.Points(geo, mat));
  scene.userData.planktonMat = mat;
})();

/* Пузыри: поднимаются вверх и рождаются заново */
const bubbles = [];
(function buildBubbles(){
  for (let i = 0; i < CONFIG.bubbles; i++){
    const mat = new THREE.SpriteMaterial({
      map: dotTex,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sprite = new THREE.Sprite(mat);
    const s = 0.18 + Math.random() * 0.45;
    sprite.scale.set(s, s, 1);

    bubbles.push({
      sprite: sprite,
      x: (Math.random() - 0.5) * 90,
      y: -45 + Math.random() * 95,
      z: (Math.random() - 0.5) * 80,
      speed: 1.4 + Math.random() * 3.2,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.6 + Math.random() * 1.4
    });
    scene.add(sprite);
  }
})();

/* =====================================================================
   8. МЕДУЗЫ
   Купол — шейдер: пульсирует, сжимается, светится по краю.
   Щупальца — ленты, колышутся волной от купола к кончику.
   ===================================================================== */
const jellyGroup = new THREE.Group();
scene.add(jellyGroup);

function makeBellMaterial(innerColor, rimColor){
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      uTime:    { value: 0 },
      uPulse:   { value: 0 },
      uRadius:  { value: 1 },
      uInner:   { value: new THREE.Color(innerColor) },
      uRim:     { value: new THREE.Color(rimColor) },
      uOpacity: { value: 0.62 }
    },
    vertexShader: `
      uniform float uTime;
      uniform float uPulse;
      uniform float uRadius;

      varying vec3 vNormalV;
      varying vec3 vViewDir;
      varying float vH;

      void main(){
        vec3 p = position;
        float h = clamp(p.y / uRadius, 0.0, 1.0);
        vH = h;

        float squeeze = uPulse * (1.0 - h * 0.82);
        p.xz *= 1.0 - squeeze * 0.30;
        p.y  -= squeeze * uRadius * 0.24;

        float rim = 1.0 - h;
        p.y += sin(uTime * 1.15 + atan(p.z, p.x) * 3.0) * 0.018 * uRadius * rim;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vNormalV = normalize(normalMatrix * normal);
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uInner;
      uniform vec3 uRim;
      uniform float uOpacity;

      varying vec3 vNormalV;
      varying vec3 vViewDir;
      varying float vH;

      void main(){
        float fres = pow(1.0 - abs(dot(normalize(vNormalV), normalize(vViewDir))), 2.1);
        vec3 col = mix(uInner, uRim, fres);
        col += uInner * pow(vH, 2.0) * 0.35;

        float a = uOpacity * (0.20 + fres * 0.80) * (0.5 + vH * 0.5);
        gl_FragColor = vec4(col, a);
      }
    `
  });
}

function makeTentacleMaterial(color){
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uOpacity: { value: 0.5 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying vec2 vUv;
      void main(){
        float fade = pow(1.0 - vUv.y, 1.6);
        gl_FragColor = vec4(uColor, uOpacity * fade);
      }
    `
  });
}

function createJellyfish(index){
  const group = new THREE.Group();

  const scale = 0.75 + Math.random() * 1.05;
  const radius = 1.6 * scale;

  const bellGeo = new THREE.SphereGeometry(
    radius,
    IS_MOBILE ? 20 : 36,
    IS_MOBILE ? 14 : 24,
    0, Math.PI * 2,
    0, Math.PI * 0.56
  );

  const palettes = [
    { inner: 0x8fd4ff, rim: 0xd6f2ff },
    { inner: 0xa89cff, rim: 0xe4dcff },
    { inner: 0x7fe8e0, rim: 0xdcfffb },
    { inner: 0xffb0d8, rim: 0xffe4f2 },
    { inner: 0x9fb6ff, rim: 0xe2ecff },
    { inner: 0x86f0c8, rim: 0xd8fff0 }
  ];
  const pal = palettes[index % palettes.length];

  const bellMat = makeBellMaterial(pal.inner, pal.rim);
  bellMat.uniforms.uRadius.value = radius;

  const bell = new THREE.Mesh(bellGeo, bellMat);
  group.add(bell);

  /* мягкое свечение вокруг купола */
  const glowMat = new THREE.SpriteMaterial({
    map: dotTex,
    color: pal.inner,
    transparent: true,
    opacity: 0.28,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(radius * 4.2, radius * 4.2, 1);
  group.add(glow);

  /* щупальца */
  const SEG = CONFIG.tentacleSegments;
  const tentacleData = [];

  for (let t = 0; t < CONFIG.tentaclesPerJelly; t++){
    const ang = (t / CONFIG.tentaclesPerJelly) * Math.PI * 2;
    const rOut = radius * 0.82;

    const vertCount = (SEG + 1) * 2;
    const positions = new Float32Array(vertCount * 3);
    const uvs = new Float32Array(vertCount * 2);
    const indices = [];

    for (let s = 0; s <= SEG; s++){
      const f = s / SEG;
      uvs[(s*2) * 2 + 0] = 0; uvs[(s*2) * 2 + 1] = f;
      uvs[(s*2 + 1) * 2 + 0] = 1; uvs[(s*2 + 1) * 2 + 1] = f;
      if (s < SEG){
        const a = s * 2;
        indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setIndex(indices);

    const mat = makeTentacleMaterial(pal.rim);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    group.add(mesh);

    tentacleData.push({
      geo: geo,
      baseX: Math.cos(ang) * rOut,
      baseZ: Math.sin(ang) * rOut,
      length: radius * (3.4 + Math.random() * 2.6),
      width: radius * 0.10,
      phase: Math.random() * Math.PI * 2,
      swaySpeed: 0.7 + Math.random() * 0.6
    });
  }

  /* положение и дрейф.
     На телефоне экран узкий, поэтому разброс по горизонтали заметно меньше —
     иначе часть медуз оказывается за кадром. */
  const spreadX = IS_MOBILE ? 9 : 26;
  const spreadY = IS_MOBILE ? 14 : 20;
  const spreadZ = IS_MOBILE ? 12 : 22;
  const anchor = new THREE.Vector3(
    (Math.random() - 0.5) * spreadX * 2,
    (Math.random() - 0.5) * spreadY,
    (Math.random() - 0.5) * spreadZ
  );
  group.position.copy(anchor);

  /* невидимый хитбокс для клика */
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 1.35, 10, 8),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  group.add(hit);

  jellyGroup.add(group);

  return {
    group: group,
    bell: bell,
    bellMat: bellMat,
    glow: glow,
    glowMat: glowMat,
    hit: hit,
    tentacles: tentacleData,
    anchor: anchor,
    phase: Math.random() * Math.PI * 2,
    driftSpeed: 0.55 + Math.random() * 0.6,
    ampX: (IS_MOBILE ? 1.2 : 3) + Math.random() * (IS_MOBILE ? 1.8 : 5),
    ampY: 2 + Math.random() * 3.5,
    ampZ: 2.5 + Math.random() * 4,
    radius: radius,
    offset: new THREE.Vector3(),
    offsetVel: new THREE.Vector3(),
    species: SPECIES[index % SPECIES.length]
  };
}

const jellyfish = [];
for (let i = 0; i < CONFIG.jellyCount; i++){
  jellyfish.push(createJellyfish(i));
}

/* =====================================================================
   13. ЗВУК: СИНТЕЗИРОВАННЫЙ ЭМБИЕНТ
   Низкий гул + медленная модуляция + редкие высокие капли.
   ===================================================================== */
let audioCtx = null;
let audioNodes = null;
let audioOn = false;
let dropTimer = null;

const btnSound = document.getElementById('btnSound');
const soundIcon = document.getElementById('soundIcon');

function startAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();

    const master = audioCtx.createGain();
    master.gain.value = 0;
    master.connect(audioCtx.destination);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    filter.Q.value = 0.8;
    filter.connect(master);

    const oscs = [];
    const freqs = [48, 72, 96.5];
    freqs.forEach(function(f, i){
      const o = audioCtx.createOscillator();
      o.type = i === 1 ? 'triangle' : 'sine';
      o.frequency.value = f;
      o.detune.value = (Math.random() - 0.5) * 9;

      const g = audioCtx.createGain();
      g.gain.value = 0.2 / (i + 1);

      o.connect(g);
      g.connect(filter);
      o.start();
      oscs.push({ osc: o, gain: g, base: f });
    });

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.045;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.045;
    lfo.connect(lfoGain);
    lfoGain.connect(master.gain);
    lfo.start();

    audioNodes = { master: master, filter: filter, oscs: oscs, lfo: lfo };
  }

  if (audioCtx.state === 'suspended') audioCtx.resume();

  audioNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
  audioNodes.master.gain.setValueAtTime(audioNodes.master.gain.value, audioCtx.currentTime);
  audioNodes.master.gain.linearRampToValueAtTime(0.16, audioCtx.currentTime + 2.2);

  scheduleDrop();

  audioOn = true;
  soundIcon.textContent = '◉';
}

function playDrop(){
  if (!audioCtx || !audioNodes) return;
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 900 + Math.random() * 1500;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.04, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.6 + Math.random());

  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 3);
}

function scheduleDrop(){
  clearTimeout(dropTimer);
  dropTimer = setTimeout(function(){
    if (audioOn){
      playDrop();
      scheduleDrop();
    }
  }, 2200 + Math.random() * 5200);
}

function stopAudio(){
  if (!audioCtx || !audioNodes) return;
  audioNodes.master.gain.cancelScheduledValues(audioCtx.currentTime);
  audioNodes.master.gain.setValueAtTime(audioNodes.master.gain.value, audioCtx.currentTime);
  audioNodes.master.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.4);
  clearTimeout(dropTimer);
  audioOn = false;
  soundIcon.textContent = '◌';
}

btnSound.addEventListener('click', function(){
  if (audioOn) stopAudio(); else startAudio();
  btnSound.classList.toggle('on', audioOn);
});

/* =====================================================================
   9. АНИМАЦИЯ ЩУПАЛЕЦ
   Каждый сегмент ленты смещается по синусоиде — волна бежит
   от купола к кончику.
   ===================================================================== */
function updateTentacles(j, time, pulse){
  const SEG = CONFIG.tentacleSegments;

  for (let t = 0; t < j.tentacles.length; t++){
    const td = j.tentacles[t];
    const arr = td.geo.attributes.position.array;

    const len = td.length * (1 - pulse * 0.12);

    for (let s = 0; s <= SEG; s++){
      const f = s / SEG;

      const wave = Math.sin(time * td.swaySpeed + f * 3.6 + td.phase);
      const wave2 = Math.cos(time * td.swaySpeed * 0.83 + f * 2.9 + td.phase * 1.4);

      const amp = (0.05 + f * f * 0.42) * len * 0.42;

      const cx = td.baseX + wave * amp;
      const cz = td.baseZ + wave2 * amp * 0.8;
      const cy = -f * len;

      const w = td.width * (1 - f * 0.72);

      const nx = -wave2 * 0.7;
      const nz = wave * 0.9;
      const nl = Math.hypot(nx, nz) || 1;

      const px = (nx / nl) * w;
      const pz = (nz / nl) * w;

      const i0 = (s * 2) * 3;
      arr[i0]     = cx - px;
      arr[i0 + 1] = cy;
      arr[i0 + 2] = cz - pz;

      arr[i0 + 3] = cx + px;
      arr[i0 + 4] = cy;
      arr[i0 + 5] = cz + pz;
    }
    td.geo.attributes.position.needsUpdate = true;
  }
}

/* =====================================================================
   10. КАМЕРА: ПЕРЕЛЁТЫ И ПОГРУЖЕНИЕ
   ===================================================================== */
const flight = {
  active: false, t: 0, dur: 1.6,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3()
};

function flyTo(position, target, duration){
  flight.fromPos.copy(camera.position);
  flight.toPos.copy(position);
  flight.fromTarget.copy(controls.target);
  flight.toTarget.copy(target);
  flight.t = 0;
  flight.dur = duration || 1.6;
  flight.active = true;
  controls.autoRotate = false;
}

function updateFlight(dt){
  if (!flight.active) return;
  flight.t += dt / flight.dur;
  const k = Math.min(1, flight.t);
  const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;

  camera.position.lerpVectors(flight.fromPos, flight.toPos, e);
  controls.target.lerpVectors(flight.fromTarget, flight.toTarget, e);

  if (k >= 1) flight.active = false;
}

let diving = false;
let diveMix = 0;
const btnDive = document.getElementById('btnDive');

btnDive.addEventListener('click', function(){
  diving = !diving;
  btnDive.classList.toggle('on', diving);
  btnDive.textContent = diving ? 'Наверх' : 'Погрузиться';

  if (diving){
    flyTo(
      new THREE.Vector3(0, CONFIG.diveDepth + 6, 30),
      new THREE.Vector3(0, CONFIG.diveDepth, 0),
      CONFIG.diveDuration
    );
  } else {
    flyTo(HOME_POS, HOME_TARGET, CONFIG.diveDuration);
  }
});

/* =====================================================================
   11. КЛИК ПО МЕДУЗЕ
   Клик отличается от перетаскивания по смещению и времени.
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const hitList = jellyfish.map(j => j.hit);

let downX = 0, downY = 0, downTime = 0;

canvasEl.addEventListener('pointerdown', function(e){
  downX = e.clientX;
  downY = e.clientY;
  downTime = performance.now();
});

canvasEl.addEventListener('pointerup', function(e){
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  const held = performance.now() - downTime;
  if (moved > 10 || held > 550) return;

  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(hitList, false);

  if (hits.length){
    const target = hits[0].object;
    const found = jellyfish.find(j => j.hit === target);
    if (found) selectJellyfish(found);
  }
});

const cardEl = document.getElementById('card');

function selectJellyfish(j){
  const worldPos = new THREE.Vector3();
  j.group.getWorldPosition(worldPos);

  const offset = new THREE.Vector3(
    j.radius * 3.4 + 4,
    j.radius * 1.6 + 2.2,
    j.radius * 3.4 + 4
  );
  flyTo(worldPos.clone().add(offset), worldPos, 1.7);

  const s = j.species;
  cardEl.innerHTML =
    '<button class="card-close" id="cardClose" aria-label="Закрыть">✕</button>' +
    '<div class="card-latin">' + s.latin + '</div>' +
    '<h2>' + s.name + '</h2>' +
    '<p>' + s.text + '</p>' +
    '<div class="card-line"><span>Купол</span><b>' + s.size + '</b></div>' +
    '<div class="card-line"><span>Глубина</span><b>' + s.depth + '</b></div>';

  cardEl.classList.add('open');
  document.body.classList.add('card-open');
  document.getElementById('cardClose').addEventListener('click', closeCard);
}

function closeCard(){
  cardEl.classList.remove('open');
  document.body.classList.remove('card-open');
}

/* =====================================================================
   12. КУРСОР ОТТАЛКИВАЕТ МЕДУЗ
   ===================================================================== */
const mouse = new THREE.Vector2(-10, -10);
const mouseRay = new THREE.Raycaster();
const rayPoint = new THREE.Vector3();
const toJelly = new THREE.Vector3();

canvasEl.addEventListener('pointermove', function(e){
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

canvasEl.addEventListener('pointerleave', function(){
  mouse.set(-10, -10);
});

function updateRepulsion(dt){
  if (mouse.x < -5) return;

  mouseRay.setFromCamera(mouse, camera);

  for (let i = 0; i < jellyfish.length; i++){
    const j = jellyfish[i];

    j.group.getWorldPosition(rayPoint);
    const dist = mouseRay.ray.distanceToPoint(rayPoint);

    if (dist < CONFIG.repelRadius){
      const closest = mouseRay.ray.closestPointToPoint(rayPoint, new THREE.Vector3());
      toJelly.copy(rayPoint).sub(closest);

      if (toJelly.lengthSq() < 0.0001){
        toJelly.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
      }
      toJelly.normalize();

      const strength = (1 - dist / CONFIG.repelRadius) * CONFIG.repelForce;
      j.offsetVel.addScaledVector(toJelly, strength * dt * 12);
    }

    j.offsetVel.addScaledVector(j.offset, -6 * dt);
    j.offsetVel.multiplyScalar(0.92);
    j.offset.addScaledVector(j.offsetVel, dt);

    if (j.offset.length() > 9) j.offset.setLength(9);
  }
}


/* =====================================================================
   14. ГЛАВНЫЙ ЦИКЛ
   ===================================================================== */
const clock = new THREE.Clock();
let elapsed = 0;

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* вода и лучи */
  waterMat.uniforms.uTime.value = elapsed;

  for (let i = 0; i < shafts.length; i++){
    const s = shafts[i];
    const wob = Math.sin(elapsed * s.speed + s.phase);
    s.mesh.rotation.z += Math.sin(elapsed * 0.1 + s.phase) * 0.0004;
    s.mat.opacity = s.baseOpacity * (0.72 + 0.28 * wob);
    s.mesh.position.x += Math.sin(elapsed * 0.16 + s.phase) * s.sway * dt;
  }

  /* планктон */
  if (scene.userData.planktonMat){
    scene.userData.planktonMat.uniforms.uTime.value = elapsed;
  }

  /* пузыри */
  for (let i = 0; i < bubbles.length; i++){
    const b = bubbles[i];
    b.y += b.speed * dt;
    b.wobble += b.wobbleSpeed * dt;

    if (b.y > 46){
      b.y = -46 - Math.random() * 10;
      b.x = (Math.random() - 0.5) * 90;
      b.z = (Math.random() - 0.5) * 80;
    }

    b.sprite.position.set(
      b.x + Math.sin(b.wobble) * 0.9,
      b.y,
      b.z + Math.cos(b.wobble * 0.8) * 0.9
    );
    b.sprite.material.opacity = 0.55 * (1 - Math.max(0, (b.y - 20) / 30));
  }

  /* медузы */
  for (let i = 0; i < jellyfish.length; i++){
    const j = jellyfish[i];

    const pulseWave = 0.5 + 0.5 * Math.sin(elapsed * CONFIG.pulseSpeed + j.phase);
    const pulse = REDUCED ? pulseWave * 0.25 : pulseWave * CONFIG.pulseDepth;

    j.bellMat.uniforms.uTime.value = elapsed;
    j.bellMat.uniforms.uPulse.value = pulse;

    const glowBase = REDUCED ? 0.22 : 0.2 + pulse * 0.22;
    j.glowMat.opacity = glowBase * (1 - diveMix * 0.35);
    const gs = j.radius * (4.0 + pulse * 0.5);
    j.glow.scale.set(gs, gs, 1);

    const t = elapsed * CONFIG.driftSpeed * j.driftSpeed;
    const px = j.anchor.x + Math.sin(t + j.phase) * j.ampX + j.offset.x;
    const py = j.anchor.y + Math.sin(t * 0.73 + j.phase * 1.7) * j.ampY + j.offset.y;
    const pz = j.anchor.z + Math.cos(t * 0.91 + j.phase * 0.6) * j.ampZ + j.offset.z;

    j.group.position.set(px, py, pz);

    j.group.rotation.z = Math.sin(t * 0.6 + j.phase) * 0.12;
    j.group.rotation.x = Math.cos(t * 0.5 + j.phase) * 0.1;

    updateTentacles(j, elapsed, pulse);
  }

  /* отталкивание курсором — только на десктопе */
  if (!IS_MOBILE) updateRepulsion(dt);

  /* погружение: свет гаснет, вода темнеет */
  const diveTarget = diving ? 1 : 0;
  // сходимся к целевому значению плавно и независимо от частоты кадров
  diveMix += (diveTarget - diveMix) * Math.min(1, dt * 2.2);

  topLight.intensity = 1.25 * (1 - diveMix * 0.62);
  ambient.intensity = 0.9 * (1 - diveMix * 0.45);
  bottomLight.intensity = 0.55 + diveMix * 1.4;
  scene.fog.density = CONFIG.fogDensity * (1 + diveMix * 0.55);
  renderer.toneMappingExposure = 1.15 - diveMix * 0.28;

  updateFlight(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* =====================================================================
   15. СЛУЖЕБНОЕ
   ===================================================================== */
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
  if (scene.userData.planktonMat){
    scene.userData.planktonMat.uniforms.uPixel.value = renderer.getPixelRatio();
  }
});

setTimeout(function(){
  const h = document.getElementById('hint');
  if (h) h.classList.add('fade');
}, 7000);

requestAnimationFrame(function(){
  setTimeout(function(){
    document.getElementById('loader').classList.add('hide');
  }, 250);
});

animate();
